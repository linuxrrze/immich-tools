version: 2

updates:
  # Python dependencies (requirements.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # Base image in the Dockerfile (tag and digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Python minor upgrades (3.13 -> 3.14) only on purpose, not automatically
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
    commit-message:
      prefix: docker

  # Actions in .github/workflows (pinned SHAs and their version comments)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
